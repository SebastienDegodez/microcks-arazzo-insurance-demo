                      content: "{\"siren\": \"100000001\", \"company\": \"Boulangerie Les Délices du Port\", \"data\": {\"address\": {\"street\": \"12 quai Duperré\", \"postalCode\": \"17000\", \"city\": \"La Rochelle\", \"inseeCityCode\": \"17300\", \"lat\": 46.1591, \"lon\": -1.152}}}"
