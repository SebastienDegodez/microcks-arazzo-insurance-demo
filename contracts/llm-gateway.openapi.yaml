# Generated by scripts/generate-contracts.py from the table of the five demo companies. Do not edit by hand.
openapi: "3.0.3"
info:
  title: LLM gateway
  version: "1.0.0"
  description: "Passerelle LLM compatible OpenAI Chat Completions. Le mock Microcks répond selon metadata.agent et metadata.siren du corps (exemple <agent>-<siren>) ; la sortie structurée de l'agent est la chaîne JSON de choices[0].message.content. L'agent climate-risk appelle un outil : tant que la requête ne contient aucun message role: tool, la réponse est un tool_calls get_resultats_rapport_risque (exemple climate-risk-<siren>-tool-call, finish_reason tool_calls) ; ensuite, la réponse finale."
paths:
  "/v1/chat/completions":
    post:
      operationId: createChatCompletion
      summary: "Créer une complétion de chat (compatible OpenAI)"
      x-microcks-operation:
        delay: 12000
        delayStrategy: random-50
        dispatcher: SCRIPT
        dispatcherRules: |
          def body = new groovy.json.JsonSlurper().parseText(mockRequest.getRequestContent() ?: "{}")
          def agent = body?.metadata?.agent
          def siren = body?.metadata?.siren
          def agents = ["data-quality", "climate-risk", "financial-health", "open-items", "verdict"]
          def sirens = ["100000001", "100000002", "100000004"]
          if (!agents.contains(agent) || !sirens.contains(siren)) {
             return "unsupported"
          }
          // The climate agent first asks for the Georisques tool, until a role: tool message brings its result.
          if (agent == "climate-risk" && !(body?.messages ?: []).any { it?.role == "tool" }) {
             return agent + "-" + siren + "-tool-call"
          }
          return agent + "-" + siren
