components:
  schemas:
    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            "$ref": "#/components/schemas/Message"
        tools:
          type: array
          items:
            "$ref": "#/components/schemas/Tool"
        response_format:
          type: object
          properties:
            type:
              type: string
          required:
            - type
        metadata:
          type: object
          properties:
            agent:
              type: string
            siren:
              type: string
          required:
            - agent
            - siren
      required:
        - model
        - messages
        - metadata
    Message:
      type: object
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          type: string
          nullable: true
        tool_calls:
          type: array
          items:
            "$ref": "#/components/schemas/ToolCall"
        tool_call_id:
          type: string
      required:
        - role
    Tool:
      type: object
      properties:
        type:
          type: string
          enum:
            - function
        function:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
          required:
            - name
      required:
        - type
        - function
    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
          required:
            - name
            - arguments
      required:
        - id
        - type
        - function
    ChatCompletion:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                "$ref": "#/components/schemas/Message"
              finish_reason:
                type: string
                enum:
                  - stop
                  - tool_calls
                  - length
            required:
              - index
              - message
              - finish_reason
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
          required:
            - prompt_tokens
            - completion_tokens
            - total_tokens
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
          required:
            - message
            - type
            - code
      required:
        - error
