openapi: "3.0.3"
info:
  title: Underwriting cases
  version: "1.0.0"
  description: |-
    L'orchestrateur de souscription Multirisque Pro. Il ouvre un dossier pour un SIREN, collecte les données (services), attend que le conseiller les valide, fait travailler les analyses LLM (l'agent climat appelle l'outil Géorisques exposé en MCP par reShapr), propose une suggestion consultative et attend la décision du conseiller.

    Le mock Microcks se comporte comme l'orchestrateur au temps près : le POST tire au hasard la durée de chaque étape (services 1,2 à 10,8 s, BODACC 10 à 30 s, comptes annuels 30 à 60 s, LLM 6 à 18 s, agent financial-health 40 à 60 s) et son décalage de démarrage (0,3 à 5 s), et les garde dans le store ; chaque GET calcule le dossier d'après le temps écoulé, en suivant dependsOn et 2 créneaux LLM (une étape LLM prête au-delà passe QUEUED). Seule l'analyse financialHealth attend la validation des données ; pendingAction signale l'action du conseiller dès qu'elle est possible, et status ne passe à WAITING_ADVISOR que quand plus rien n'avance sans lui. Les réponses sont rendues par templating (variable caseJson posée par le script).
