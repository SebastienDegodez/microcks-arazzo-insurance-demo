# Generated by scripts/generate-contracts.py from the table of the five demo companies. Do not edit by hand.
openapi: "3.0.3"
info:
  title: Underwriting cases
  version: "1.0.0"
  description: "The Multirisk Pro underwriting orchestrator. It opens a case for a SIREN, collects the data, waits for the advisor to validate it, runs the LLM analyses (some agents use MCP tools), produces an advisory suggestion and waits for the advisor's decision. pendingAction tells which advisor action is expected as soon as it is possible; status becomes WAITING_ADVISOR only when nothing moves on without the advisor."
paths:
  "/underwriting-cases":
    post:
      operationId: createUnderwritingCase
      summary: Open an underwriting case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CaseRequest"
      responses:
        "202":
          description: The case is open and the data collection has started
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CaseCreated"
        "400":
          description: Invalid SIREN
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/underwriting-cases/{caseId}":
    get:
      operationId: getUnderwritingCase
      summary: Read an underwriting case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Case"
        "404":
          description: Unknown case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/underwriting-cases/{caseId}/data-review":
    post:
      operationId: reviewCaseData
      summary: "Validate (or correct) the collected data"
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DataReviewRequest"
      responses:
        "200":
          description: "The case, which resumes its analyses"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Case"
        "404":
          description: Unknown case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: The case is not waiting for the data review
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/underwriting-cases/{caseId}/advisor-decision":
    post:
      operationId: recordAdvisorDecision
      summary: "Record the advisor's decision"
      description: "followsRecommendation is computed by the server: the decision and the surcharge are those of the suggestion. A missing surchargePercent is the suggested surcharge if the decision is the suggested one, 0 otherwise. A comment is required to depart from the suggestion; with a REINFORCED escalation, every reason must be acknowledged (acknowledgedReasons) and the comment is required."
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AdvisorDecisionRequest"
      responses:
        "200":
          description: The decided case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Case"
        "400":
          description: Incomplete decision
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Unknown case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: The case is not waiting for the decision
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  schemas:
    CaseRequest:
      type: object
      properties:
        siren:
          type: string
          pattern: "^[0-9]{9}$"
        product:
          type: string
          enum:
            - MULTIRISQUE_PRO
      required:
        - siren
        - product
    CaseCreated:
      type: object
      properties:
        caseId:
          type: string
        status:
          type: string
          enum:
            - IN_PROGRESS
      required:
        - caseId
        - status
    Case:
      type: object
      properties:
        caseId:
          type: string
        siren:
          type: string
        product:
          type: string
        companyName:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - IN_PROGRESS
            - WAITING_ADVISOR
            - DECIDED
        pendingAction:
          type: string
          enum:
            - DATA_REVIEW
            - DECISION
            - null
          nullable: true
        stepOrder:
          type: array
          items:
            type: string
          minItems: 12
          maxItems: 12
        steps:
          type: object
          properties:
            checkAccount:
              "$ref": "#/components/schemas/Step"
            companyIdentity:
              "$ref": "#/components/schemas/Step"
            legalEvents:
              "$ref": "#/components/schemas/Step"
            financials:
              "$ref": "#/components/schemas/Step"
            openItems:
              "$ref": "#/components/schemas/Step"
            dataQuality:
              "$ref": "#/components/schemas/Step"
            dataReview:
              "$ref": "#/components/schemas/Step"
            climateRisk:
              "$ref": "#/components/schemas/Step"
            financialHealth:
              "$ref": "#/components/schemas/Step"
            openItemsReview:
              "$ref": "#/components/schemas/Step"
            synthesis:
              "$ref": "#/components/schemas/Step"
            advisorDecision:
              "$ref": "#/components/schemas/Step"
          required:
            - checkAccount
            - companyIdentity
            - legalEvents
            - financials
            - openItems
            - dataQuality
            - dataReview
            - climateRisk
            - financialHealth
            - openItemsReview
            - synthesis
            - advisorDecision
        recommendation:
          "$ref": "#/components/schemas/Recommendation"
        dataReview:
          "$ref": "#/components/schemas/DataReview"
        escalation:
          "$ref": "#/components/schemas/Escalation"
        advisorDecision:
          "$ref": "#/components/schemas/AdvisorDecision"
      required:
        - caseId
        - siren
        - product
        - createdAt
        - status
        - pendingAction
        - stepOrder
        - steps
    Step:
      type: object
      properties:
        label:
          type: string
        phase:
          type: integer
          minimum: 1
          maximum: 6
        mode:
          type: string
          enum:
            - CHAIN
            - PARALLEL
        kind:
          type: string
          enum:
            - SERVICE
            - MCP
            - LLM
            - RULE
            - HUMAN
        status:
          type: string
          enum:
            - PENDING
            - QUEUED
            - RUNNING
            - WAITING
            - DONE
            - SKIPPED
            - FAILED
        dependsOn:
          type: array
          items:
            type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        summary:
          type: string
        result:
          type: object
        calls:
          type: array
          items:
            "$ref": "#/components/schemas/Call"
      required:
        - label
        - phase
        - mode
        - kind
        - status
        - dependsOn
        - calls
    Call:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        status:
          type: integer
        via:
          type: string
          enum:
            - REST
            - MCP
            - LLM
      required:
        - method
        - url
        - status
        - via
    Recommendation:
      type: object
      properties:
        decision:
          type: string
          enum:
            - ACCEPT
            - ACCEPT_WITH_SURCHARGE
            - REVIEW
            - REFUSE
            - NOT_ELIGIBLE
        surchargePercent:
          type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1
        rationale:
          type: array
          items:
            type: string
        source:
          type: string
          enum:
            - LLM
            - RULE
      required:
        - decision
        - surchargePercent
        - confidence
        - rationale
        - source
    Corrections:
      type: object
      properties:
        declaredHeadcount:
          type: integer
          minimum: 0
      required: []
    DataReviewRequest:
      type: object
      properties:
        confirmed:
          type: boolean
        corrections:
          "$ref": "#/components/schemas/Corrections"
        comment:
          type: string
      required:
        - confirmed
    DataReview:
      type: object
      properties:
        confirmed:
          type: boolean
        corrections:
          "$ref": "#/components/schemas/Corrections"
        comment:
          type: string
        reviewedAt:
          type: string
          format: date-time
      required:
        - confirmed
        - corrections
        - comment
        - reviewedAt
    Escalation:
      type: object
      properties:
        level:
          type: string
          enum:
            - STANDARD
            - REINFORCED
        reasons:
          type: array
          items:
            "$ref": "#/components/schemas/RiskReason"
      required:
        - level
        - reasons
    RiskReason:
      type: object
      properties:
        code:
          type: string
          enum:
            - UNKNOWN_CUSTOMER
            - COLLECTIVE_PROCEDURE
            - CLIMATE_HIGH
            - FINANCIAL_FRAGILE
            - OPEN_LITIGATION
            - DATA_INCONSISTENT
        label:
          type: string
        stepId:
          type: string
      required:
        - code
        - label
        - stepId
    AdvisorDecisionRequest:
      type: object
      properties:
        finalDecision:
          type: string
          enum:
            - ACCEPT
            - ACCEPT_WITH_SURCHARGE
            - REVIEW
            - REFUSE
            - NOT_ELIGIBLE
        surchargePercent:
          type: number
        comment:
          type: string
        acknowledgedReasons:
          type: array
          items:
            type: string
            enum:
              - UNKNOWN_CUSTOMER
              - COLLECTIVE_PROCEDURE
              - CLIMATE_HIGH
              - FINANCIAL_FRAGILE
              - OPEN_LITIGATION
              - DATA_INCONSISTENT
      required:
        - finalDecision
    AdvisorDecision:
      type: object
      properties:
        finalDecision:
          type: string
          enum:
            - ACCEPT
            - ACCEPT_WITH_SURCHARGE
            - REVIEW
            - REFUSE
            - NOT_ELIGIBLE
        surchargePercent:
          type: number
        followsRecommendation:
          type: boolean
        comment:
          type: string
        acknowledgedReasons:
          type: array
          items:
            type: string
            enum:
              - UNKNOWN_CUSTOMER
              - COLLECTIVE_PROCEDURE
              - CLIMATE_HIGH
              - FINANCIAL_FRAGILE
              - OPEN_LITIGATION
              - DATA_INCONSISTENT
        decidedAt:
          type: string
          format: date-time
      required:
        - finalDecision
        - surchargePercent
        - followsRecommendation
        - comment
        - decidedAt
    Error:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        message:
          type: string
