# Generated by scripts/generate-contracts.py from the table of the five demo companies. Do not edit by hand.
openapi: "3.0.3"
info:
  title: Georisques
  version: "1.0.0"
  description: "Risques naturels d'une adresse (inspiré du rapport de risques de Géorisques), simplifié pour la démo. Le mock répond selon code_insee ; latlon (longitude,latitude) est accepté tel quel. Exposé aussi en MCP par Microcks."
paths:
  "/resultats_rapport_risque":
    get:
      operationId: getRapportRisque
      summary: "Rapport des risques naturels d'une commune et d'un point"
      description: "Renvoie les risques naturels connus pour une commune (code INSEE) et un point (longitude,latitude)."
      parameters:
        - name: code_insee
          in: query
          required: true
          schema:
            type: string
          description: "Code INSEE de la commune, par exemple 17300."
          examples:
            insee-17300:
              value: "17300"
            insee-63113:
              value: "63113"
            insee-59350:
              value: "59350"
            insee-84007:
              value: "84007"
        - name: latlon
          in: query
          required: true
          schema:
            type: string
          description: "Longitude et latitude séparées par une virgule, par exemple -1.152,46.1591."
          examples:
            insee-17300:
              value: "-1.1520,46.1591"
            insee-63113:
              value: "3.0870,45.7772"
            insee-59350:
              value: "3.0573,50.6292"
            insee-84007:
              value: "4.8055,43.9493"
      x-microcks-operation:
        delay: 6000
        delayStrategy: random-80
        dispatcher: SCRIPT
        dispatcherRules: |
          def codeInsee = mockRequest.getRequest()?.getParameter("code_insee")
          if (["17300", "63113", "59350", "84007"].contains(codeInsee)) {
             return "insee-" + codeInsee
          }
          return "unknown"
      responses:
        "200":
          description: Le rapport de risques
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RapportRisque"
              examples:
                insee-17300:
                  value:
                    commune: La Rochelle
                    risquesNaturels:
                      inondation:
                        present: true
                        level: MEDIUM
                      submersionMarine:
                        present: true
                        level: HIGH
                      retraitGonflementArgiles:
                        present: true
                        level: LOW
                      seisme:
                        zone: 3
                      feuxForet:
                        present: false
                        level: NONE
                insee-63113:
                  value:
                    commune: Clermont-Ferrand
                    risquesNaturels:
                      inondation:
                        present: true
                        level: LOW
                      submersionMarine:
                        present: false
                        level: NONE
                      retraitGonflementArgiles:
                        present: true
                        level: LOW
                      seisme:
                        zone: 3
                      feuxForet:
                        present: false
                        level: NONE
                insee-59350:
                  value:
                    commune: Lille
                    risquesNaturels:
                      inondation:
                        present: true
                        level: MEDIUM
                      submersionMarine:
                        present: false
                        level: NONE
                      retraitGonflementArgiles:
                        present: true
                        level: MEDIUM
                      seisme:
                        zone: 2
                      feuxForet:
                        present: false
                        level: NONE
                insee-84007:
                  value:
                    commune: Avignon
                    risquesNaturels:
                      inondation:
                        present: true
                        level: MEDIUM
                      submersionMarine:
                        present: false
                        level: NONE
                      retraitGonflementArgiles:
                        present: true
                        level: HIGH
                      seisme:
                        zone: 3
                      feuxForet:
                        present: true
                        level: LOW
components:
  schemas:
    RapportRisque:
      type: object
      properties:
        commune:
          type: string
        risquesNaturels:
          type: object
          properties:
            inondation:
              "$ref": "#/components/schemas/Alea"
            submersionMarine:
              "$ref": "#/components/schemas/Alea"
            retraitGonflementArgiles:
              "$ref": "#/components/schemas/Alea"
            seisme:
              type: object
              properties:
                zone:
                  type: integer
                  minimum: 1
                  maximum: 5
              required:
                - zone
            feuxForet:
              "$ref": "#/components/schemas/Alea"
          required:
            - inondation
            - submersionMarine
            - retraitGonflementArgiles
            - seisme
            - feuxForet
      required:
        - commune
        - risquesNaturels
    Alea:
      type: object
      properties:
        present:
          type: boolean
        level:
          type: string
          enum:
            - NONE
            - LOW
            - MEDIUM
            - HIGH
      required:
        - present
        - level
