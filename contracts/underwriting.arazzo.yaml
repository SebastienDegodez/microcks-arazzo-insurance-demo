          - condition: "$response.body#/steps/synthesis/status == 'SKIPPED'"
          - condition: "$response.body#/recommendation/decision == 'NOT_ELIGIBLE'"
          - condition: "$response.body#/recommendation/source == 'RULE'"
          - condition: "$response.body#/escalation/level == 'REINFORCED'"
          - condition: "$response.body#/escalation/reasons/0/code == 'UNKNOWN_CUSTOMER'"
        onFailure:
          - name: advisorNotExpectedYet
            type: retry
            retryAfter: 2
            retryLimit: 150
            criteria:
              - condition: "$response.body#/pendingAction != 'DECISION'"
        outputs:
          suggestedDecision: "$response.body#/recommendation/decision"
          suggestedSurchargePercent: "$response.body#/recommendation/surchargePercent"
          escalationLevel: "$response.body#/escalation/level"
      - stepId: decide
        operationId: "$sourceDescriptions.underwritingApi.recordAdvisorDecision"
        parameters:
          - name: caseId
            in: path
            value: "$steps.openCase.outputs.caseId"
        requestBody:
          contentType: application/json
          payload:
            finalDecision: NOT_ELIGIBLE
            comment: "Prospect inconnu du CRM : à créer avant toute étude."
            acknowledgedReasons:
              - UNKNOWN_CUSTOMER
        successCriteria:
          - condition: "$statusCode == 200"
          - condition: "$response.body#/status == 'DECIDED'"
          - condition: "$response.body#/steps/advisorDecision/status == 'DONE'"
          - condition: "$response.body#/advisorDecision/followsRecommendation == true"
        outputs:
          status: "$response.body#/status"
          finalDecision: "$response.body#/advisorDecision/finalDecision"
          followsRecommendation: "$response.body#/advisorDecision/followsRecommendation"
    outputs:
      suggestedDecision: "$steps.waitForDecision.outputs.suggestedDecision"
      suggestedSurchargePercent: "$steps.waitForDecision.outputs.suggestedSurchargePercent"
      escalationLevel: "$steps.waitForDecision.outputs.escalationLevel"
      status: "$steps.decide.outputs.status"
      finalDecision: "$steps.decide.outputs.finalDecision"
      followsRecommendation: "$steps.decide.outputs.followsRecommendation"
  - workflowId: highRiskRequiresReinforcedDecision
    summary: "Un risque trop important pour plusieurs raisons exige une décision renforcée : sans reconnaître chaque raison, la décision est refusée (400)."
    inputs:
      type: object
      properties:
        siren:
          type: string
          pattern: "^[0-9]{9}$"
        finalDecision:
          type: string
        comment:
          type: string
          minLength: 1
        acknowledgedReasons:
          type: array
          items:
            type: string
      required:
        - siren
        - finalDecision
        - comment
        - acknowledgedReasons
    steps:
      - stepId: openCase
        operationId: "$sourceDescriptions.underwritingApi.createUnderwritingCase"
        requestBody:
          contentType: application/json
          payload:
            siren: ""
            product: MULTIRISQUE_PRO
          replacements:
            - target: "/siren"
              value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 202"
          - condition: "$response.body#/status == 'IN_PROGRESS'"
        outputs:
          caseId: "$response.body#/caseId"
      - stepId: waitForDataReview
        operationId: "$sourceDescriptions.underwritingApi.getUnderwritingCase"
        description: "Lit le dossier toutes les 2 s (150 fois au plus) jusqu'à ce que pendingAction soit DATA_REVIEW."
        parameters:
          - name: caseId
            in: path
            value: "$steps.openCase.outputs.caseId"
        successCriteria:
          - condition: "$statusCode == 200"
          - condition: "$response.body#/pendingAction == 'DATA_REVIEW'"
          - condition: "$response.body#/steps/checkAccount/status == 'DONE'"
          - condition: "$response.body#/steps/companyIdentity/status == 'DONE'"
          - condition: "$response.body#/steps/legalEvents/status == 'DONE'"
          - condition: "$response.body#/steps/financials/status == 'DONE'"
          - condition: "$response.body#/steps/openItems/status == 'DONE'"
          - condition: "$response.body#/steps/dataQuality/status == 'DONE'"
          - condition: "$response.body#/steps/dataReview/status == 'WAITING'"
          - condition: "$response.body#/steps/financialHealth/status == 'PENDING'"
          - condition: "$response.body#/steps/synthesis/status == 'PENDING'"
          - condition: "$response.body#/steps/advisorDecision/status == 'PENDING'"
        onFailure:
          - name: advisorNotExpectedYet
            type: retry
            retryAfter: 2
            retryLimit: 150
            criteria:
              - condition: "$response.body#/pendingAction != 'DATA_REVIEW'"
      - stepId: validateData
        operationId: "$sourceDescriptions.underwritingApi.reviewCaseData"
        description: "Le conseiller confirme les données collectées."
        parameters:
          - name: caseId
            in: path
            value: "$steps.openCase.outputs.caseId"
        requestBody:
          contentType: application/json
          payload:
            confirmed: true
            corrections: {}
            comment: "Données vérifiées par le conseiller."
        successCriteria:
          - condition: "$statusCode == 200"
          - condition: "$response.body#/status == 'IN_PROGRESS'"
          - condition: "$response.body#/steps/dataReview/status == 'DONE'"
          - condition: "$response.body#/dataReview/confirmed == true"
      - stepId: waitForSuggestion
        operationId: "$sourceDescriptions.underwritingApi.getUnderwritingCase"
        description: "Lit le dossier toutes les 2 s (150 fois au plus) jusqu'à ce que pendingAction soit DECISION."
        parameters:
          - name: caseId
            in: path
            value: "$steps.openCase.outputs.caseId"
        successCriteria:
          - condition: "$statusCode == 200"
          - condition: "$response.body#/pendingAction == 'DECISION'"
          - condition: "$response.body#/status == 'WAITING_ADVISOR'"
          - condition: "$response.body#/steps/climateRisk/status == 'DONE'"
          - condition: "$response.body#/steps/financialHealth/status == 'DONE'"
          - condition: "$response.body#/steps/openItemsReview/status == 'DONE'"
          - condition: "$response.body#/steps/synthesis/status == 'DONE'"
          - condition: "$response.body#/steps/climateRisk/calls/0/via == 'MCP'"
          - condition: "$response.body#/steps/climateRisk/calls/1/via == 'LLM'"
          - condition: "$response.body#/steps/climateRisk/calls/2/via == 'MCP'"
          - condition: "$response.body#/steps/climateRisk/calls/3/via == 'LLM'"
          - condition: "$response.body#/steps/synthesis/kind == 'LLM'"
          - condition: "$response.body#/recommendation/source == 'LLM'"
          - condition: "$response.body#/steps/advisorDecision/status == 'WAITING'"
          - condition: "$response.body#/escalation/level == 'REINFORCED'"
        onFailure:
          - name: advisorNotExpectedYet
            type: retry
            retryAfter: 2
            retryLimit: 150
            criteria:
              - condition: "$response.body#/pendingAction != 'DECISION'"
        outputs:
          suggestedDecision: "$response.body#/recommendation/decision"
          suggestedSurchargePercent: "$response.body#/recommendation/surchargePercent"
          escalationLevel: "$response.body#/escalation/level"
      - stepId: decideWithoutAcknowledging
        operationId: "$sourceDescriptions.underwritingApi.recordAdvisorDecision"
        parameters:
          - name: caseId
            in: path
            value: "$steps.openCase.outputs.caseId"
        requestBody:
          contentType: application/json
          payload:
            finalDecision: REFUSE
            comment: ""
            acknowledgedReasons: []
          replacements:
            - target: "/finalDecision"
              value: "$inputs.finalDecision"
            - target: "/comment"
              value: "$inputs.comment"
        successCriteria:
          - condition: "$statusCode == 400"
          - condition: "$response.body#/code == 'REASONS_NOT_ACKNOWLEDGED'"
        outputs:
          errorCode: "$response.body#/code"
      - stepId: decide
        operationId: "$sourceDescriptions.underwritingApi.recordAdvisorDecision"
        parameters:
          - name: caseId
            in: path
            value: "$steps.openCase.outputs.caseId"
        requestBody:
          contentType: application/json
          payload:
            finalDecision: REFUSE
            comment: ""
            acknowledgedReasons: []
          replacements:
            - target: "/finalDecision"
              value: "$inputs.finalDecision"
            - target: "/comment"
              value: "$inputs.comment"
            - target: "/acknowledgedReasons"
              value: "$inputs.acknowledgedReasons"
        successCriteria:
          - condition: "$statusCode == 200"
          - condition: "$response.body#/status == 'DECIDED'"
          - condition: "$response.body#/steps/advisorDecision/status == 'DONE'"
        outputs:
          status: "$response.body#/status"
          finalDecision: "$response.body#/advisorDecision/finalDecision"
          followsRecommendation: "$response.body#/advisorDecision/followsRecommendation"
    outputs:
      suggestedDecision: "$steps.waitForSuggestion.outputs.suggestedDecision"
      suggestedSurchargePercent: "$steps.waitForSuggestion.outputs.suggestedSurchargePercent"
      escalationLevel: "$steps.waitForSuggestion.outputs.escalationLevel"
      rejectedWith: "$steps.decideWithoutAcknowledging.outputs.errorCode"
      status: "$steps.decide.outputs.status"
      finalDecision: "$steps.decide.outputs.finalDecision"
      followsRecommendation: "$steps.decide.outputs.followsRecommendation"
  - workflowId: collectiveProcedureSkipsAnalyses
