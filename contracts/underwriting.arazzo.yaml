      suggestedSurchargePercent: "$steps.waitForSuggestion.outputs.suggestedSurchargePercent"
      escalationLevel: "$steps.waitForSuggestion.outputs.escalationLevel"
      status: "$steps.decide.outputs.status"
      finalDecision: "$steps.decide.outputs.finalDecision"
