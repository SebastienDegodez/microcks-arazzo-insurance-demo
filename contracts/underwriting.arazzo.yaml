  - workflowId: orchestratorCollectsCompanyData
    summary: "Ce que l'orchestrateur doit appeler pour un dossier : le CRM d'abord, puis les 4 sources en parallèle, avec le customerId du CRM pour les sinistres."
    inputs:
      type: object
      properties:
        siren:
          type: string
          pattern: "^[0-9]{9}$"
      required:
        - siren
    steps:
      - stepId: checkAccount
        operationId: "$sourceDescriptions.customerAccounts.getCustomerBySiren"
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          customerId: "$response.body#/customerId"
      - stepId: companyIdentity
        operationId: "$sourceDescriptions.sirene.getUniteLegale"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          inseeCityCode: "$response.body#/address/inseeCityCode"
      - stepId: legalEvents
        operationId: "$sourceDescriptions.bodacc.searchAnnonces"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: query
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: financials
        operationId: "$sourceDescriptions.companyFinancials.getFinancials"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: openItems
        operationId: "$sourceDescriptions.claimsAndContracts.getOpenItems"
        dependsOn:
          - checkAccount
        parameters:
          - name: customerId
            in: path
            value: "$steps.checkAccount.outputs.customerId"
        successCriteria:
          - condition: "$statusCode == 200"
    outputs:
      customerId: "$steps.checkAccount.outputs.customerId"
  - workflowId: customerUnknownStopsTheCase
    summary: "Le CRM ne connaît pas le SIREN : l'orchestrateur s'arrête après lui, sans appeler les 4 sources."
    inputs:
      type: object
      properties:
        siren:
          type: string
          pattern: "^[0-9]{9}$"
      required:
        - siren
    steps:
      - stepId: checkAccount
        operationId: "$sourceDescriptions.customerAccounts.getCustomerBySiren"
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 404"
