# Generated by scripts/generate-contracts.py from the table of the five demo companies. Do not edit by hand.
arazzo: "1.1.0"
info:
  title: Commercial underwriting agent tools
  version: "1.0.0"
  summary: "Les outils MCP des agents, vus depuis les API que reShapr appelle."
  description: |
    L'agent climat reçoit de l'orchestrateur les outils Géorisques et BODACC exposés par reShapr. Le modèle (mock Microcks) demande les deux ; l'orchestrateur les exécute via reShapr, qui appelle les mocks Microcks en transmettant x-microcks-session. La session vérifie que ces appels arrivent, après la collecte, avec les bonnes données : le code INSEE de Sirene pour Géorisques, le SIREN du dossier pour le BODACC.
sourceDescriptions:
  - name: customerAccounts
    url: "./customer-accounts.openapi.yaml"
    type: openapi
  - name: sirene
    url: "./sirene.openapi.yaml"
    type: openapi
  - name: bodacc
    url: "./bodacc.openapi.yaml"
    type: openapi
  - name: companyFinancials
    url: "./company-financials.openapi.yaml"
    type: openapi
  - name: claimsAndContracts
    url: "./claims-and-contracts.openapi.yaml"
    type: openapi
  - name: georisques
    url: "./georisques.openapi.yaml"
    type: openapi
workflows:
  - workflowId: climateToolsGoThroughReshapr
    summary: "La collecte, puis les deux outils de l'agent climat, appelés par reShapr pour le modèle."
    inputs:
      type: object
      properties:
        siren:
          type: string
          pattern: "^[0-9]{9}$"
      required:
        - siren
    steps:
      - stepId: checkAccount
        operationId: "$sourceDescriptions.customerAccounts.getCustomerBySiren"
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          customerId: "$response.body#/customerId"
      - stepId: companyIdentity
        operationId: "$sourceDescriptions.sirene.getUniteLegale"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          inseeCityCode: "$response.body#/address/inseeCityCode"
      - stepId: legalEvents
        operationId: "$sourceDescriptions.bodacc.searchAnnonces"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: query
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: financials
        operationId: "$sourceDescriptions.companyFinancials.getFinancials"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: openItems
        operationId: "$sourceDescriptions.claimsAndContracts.getOpenItems"
        dependsOn:
          - checkAccount
        parameters:
          - name: customerId
            in: path
            value: "$steps.checkAccount.outputs.customerId"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: climateNaturalRisks
        operationId: "$sourceDescriptions.georisques.getRapportRisque"
        description: "Outil get_resultats_rapport_risque de l'agent climat, appelé par reShapr."
        dependsOn:
          - companyIdentity
          - legalEvents
          - financials
        parameters:
          - name: code_insee
            in: query
            value: "$steps.companyIdentity.outputs.inseeCityCode"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: climateLegalEvents
        operationId: "$sourceDescriptions.bodacc.searchAnnonces"
        description: "Outil get_annonces de l'agent climat, appelé par reShapr : un second appel au BODACC, après celui de la collecte."
        dependsOn:
          - companyIdentity
          - legalEvents
          - financials
        parameters:
          - name: siren
            in: query
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
    outputs:
      customerId: "$steps.checkAccount.outputs.customerId"
      inseeCityCode: "$steps.companyIdentity.outputs.inseeCityCode"
