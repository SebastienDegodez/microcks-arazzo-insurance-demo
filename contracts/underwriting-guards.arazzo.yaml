# Generated by scripts/generate-contracts.py from the table of the five demo companies. Do not edit by hand.
arazzo: "1.1.0"
info:
  title: Commercial underwriting guards
  version: "1.0.0"
  summary: "Ce que l'orchestrateur ne doit PAS appeler."
  description: |
    Le LLM gateway est lié au document sans aucune étape : dans une session, tout appel LLM est un appel inattendu. Avec une procédure collective (injectée par S17 sur legalEvents), la collecte se termine et aucun LLM n'est appelé.
sourceDescriptions:
  - name: customerAccounts
    url: "./customer-accounts.openapi.yaml"
    type: openapi
  - name: sirene
    url: "./sirene.openapi.yaml"
    type: openapi
  - name: bodacc
    url: "./bodacc.openapi.yaml"
    type: openapi
  - name: companyFinancials
    url: "./company-financials.openapi.yaml"
    type: openapi
  - name: claimsAndContracts
    url: "./claims-and-contracts.openapi.yaml"
    type: openapi
  - name: llmGateway
    url: "./llm-gateway.openapi.yaml"
    type: openapi
workflows:
  - workflowId: collectiveProcedureStopsTheAnalyses
    summary: "Le BODACC signale une procédure collective : la collecte se termine, et aucun LLM n'est appelé."
    inputs:
      type: object
      properties:
        siren:
          type: string
          pattern: "^[0-9]{9}$"
      required:
        - siren
    steps:
      - stepId: checkAccount
        operationId: "$sourceDescriptions.customerAccounts.getCustomerBySiren"
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          customerId: "$response.body#/customerId"
      - stepId: companyIdentity
        operationId: "$sourceDescriptions.sirene.getUniteLegale"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
        outputs:
          inseeCityCode: "$response.body#/address/inseeCityCode"
      - stepId: legalEvents
        operationId: "$sourceDescriptions.bodacc.searchAnnonces"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: query
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: financials
        operationId: "$sourceDescriptions.companyFinancials.getFinancials"
        dependsOn:
          - checkAccount
        parameters:
          - name: siren
            in: path
            value: "$inputs.siren"
        successCriteria:
          - condition: "$statusCode == 200"
      - stepId: openItems
        operationId: "$sourceDescriptions.claimsAndContracts.getOpenItems"
        dependsOn:
          - checkAccount
        parameters:
          - name: customerId
            in: path
            value: "$steps.checkAccount.outputs.customerId"
        successCriteria:
          - condition: "$statusCode == 200"
    outputs:
      customerId: "$steps.checkAccount.outputs.customerId"
