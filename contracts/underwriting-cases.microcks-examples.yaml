apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: Underwriting cases
  version: "1.0.0"
operations:
  POST /underwriting-cases:
    created:
      request:
        body:
          siren: "100000001"
          product: MULTIRISQUE_PRO
      response:
        status: "202"
        mediaType: application/json
        body:
          caseId: "{{ caseId }}"
          status: IN_PROGRESS
    invalid-siren:
      request:
        body:
          siren: "1234"
          product: MULTIRISQUE_PRO
      response:
        status: "400"
        mediaType: application/json
        body:
          code: INVALID_SIREN
          message: Le SIREN doit compter 9 chiffres.
  "GET /underwriting-cases/{caseId}":
    case:
      request:
        parameters:
          caseId: case-100000001
      response:
        status: "200"
        mediaType: application/json
        body: "{{ caseJson }}"
    not-found:
      request:
        parameters:
          caseId: case-000000000
      response:
        status: "404"
        mediaType: application/json
        body:
          code: CASE_NOT_FOUND
          message: Aucun dossier pour cet identifiant.
  "POST /underwriting-cases/{caseId}/data-review":
    case:
      request:
        parameters:
          caseId: case-100000001
        body:
          confirmed: true
          corrections:
            declaredHeadcount: 8
          comment: "Effectif vérifié sur la DSN : 8 salariés."
      response:
        status: "200"
        mediaType: application/json
        body: "{{ caseJson }}"
    not-found:
      request:
        parameters:
          caseId: case-000000000
        body:
          confirmed: true
          corrections: {}
          comment: ""
      response:
        status: "404"
        mediaType: application/json
        body:
          code: CASE_NOT_FOUND
          message: Aucun dossier pour cet identifiant.
    not-expected:
      request:
        parameters:
          caseId: case-100000001
        body:
          confirmed: true
          corrections: {}
          comment: ""
      response:
        status: "409"
        mediaType: application/json
        body:
          code: NOT_EXPECTED
          message: "Le dossier n'attend pas cette action du conseiller (voir pendingAction)."
  "POST /underwriting-cases/{caseId}/advisor-decision":
    case:
      request:
        parameters:
          caseId: case-100000001
        body:
          finalDecision: ACCEPT
          surchargePercent: 0
          comment: "Batardeaux anti-submersion posés en 2024 et visite de risque favorable : j'accepte sans surprime."
          acknowledgedReasons: []
      response:
        status: "200"
        mediaType: application/json
        body: "{{ caseJson }}"
    not-found:
      request:
        parameters:
          caseId: case-000000000
        body:
          finalDecision: ACCEPT
          comment: ""
      response:
        status: "404"
        mediaType: application/json
        body:
          code: CASE_NOT_FOUND
          message: Aucun dossier pour cet identifiant.
    not-expected:
      request:
        parameters:
          caseId: case-100000001
        body:
          finalDecision: ACCEPT
          comment: "Trop tôt : données non validées."
      response:
        status: "409"
        mediaType: application/json
        body:
          code: NOT_EXPECTED
          message: "Le dossier n'attend pas cette action du conseiller (voir pendingAction)."
    comment-required:
      request:
        parameters:
          caseId: case-100000001
        body:
          finalDecision: REFUSE
          comment: ""
      response:
        status: "400"
        mediaType: application/json
        body:
          code: COMMENT_REQUIRED
          message: "Un commentaire est obligatoire pour s'écarter de la suggestion ou pour une décision renforcée."
    reasons-not-acknowledged:
      request:
        parameters:
          caseId: case-100000004
        body:
          finalDecision: REFUSE
          comment: Contentieux en cours.
          acknowledgedReasons:
            - OPEN_LITIGATION
      response:
        status: "400"
        mediaType: application/json
        body:
          code: REASONS_NOT_ACKNOWLEDGED
          message: "Décision renforcée : chaque raison de risque doit être reconnue."
    invalid-decision:
      request:
        parameters:
          caseId: case-100000001
        body:
          finalDecision: MAYBE
          comment: ""
      response:
        status: "400"
        mediaType: application/json
        body:
          code: INVALID_DECISION
          message: "finalDecision n'est pas une décision connue."
