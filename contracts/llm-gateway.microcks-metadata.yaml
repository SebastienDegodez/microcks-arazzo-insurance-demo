# Generated by scripts/generate-contracts.py from the table of the five demo companies. Do not edit by hand.
# Microcks only: how the mock dispatches and how long it takes. The JS dispatcher answers according to
# metadata.agent and metadata.siren of the body (example <agent>-<siren>). climate-risk must be offered
# get_resultats_rapport_risque and get_annonces (Géorisques and BODACC through reShapr), financial-health
# get_companies_siren_financials (Microcks' native MCP), each with its required arguments, else 400 missing-tools.
# Until the request carries a role: tool message, the answer is the tool_calls (example <agent>-<siren>-tool-calls),
# then the final answer.
apiVersion: mocks.microcks.io/v1alpha1
kind: APIMetadata
metadata:
  name: LLM gateway
  version: "1.0.0"
operations:
  POST /v1/chat/completions:
    delay: 12000
    delayStrategy: random-50
    dispatcher: JS
    dispatcherRules: |
      const body = JSON.parse(mockRequest.getRequestContent() || "{}");
      const metadata = body.metadata || {};
      const agent = metadata.agent;
      const siren = metadata.siren;
      if (!["data-quality","climate-risk","financial-health","open-items","verdict"].includes(agent) || !["100000001","100000002","100000004"].includes(siren)) {
        return "unsupported";
      }
      // A tool-using agent must be given its MCP tools, each with its required arguments: this is what the test checks.
      const expected = {"climate-risk":{"get_resultats_rapport_risque":["code_insee","latlon"],"get_annonces":["siren"]},"financial-health":{"get_companies_siren_financials":["siren"]}}[agent];
      if (expected) {
        const offered = {};
        (body.tools || []).forEach(tool => {
          if (tool && tool.function) offered[tool.function.name] = (tool.function.parameters || {}).required || [];
        });
        const complete = Object.keys(expected).every(name =>
          offered[name] && expected[name].every(argument => offered[name].includes(argument)));
        if (!complete) {
          return "missing-tools";
        }
        // First turn: the model asks for its tools. Once role: tool messages bring their results, it answers.
        if (!(body.messages || []).some(message => message && message.role === "tool")) {
          return agent + "-" + siren + "-tool-calls";
        }
      }
      return agent + "-" + siren;
